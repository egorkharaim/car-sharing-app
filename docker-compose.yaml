services:
  mysql:
    image: mysql:8.0.33
    container_name: car-sharing-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQLDB_DATABASE:-car_sharing}
      MYSQL_ROOT_PASSWORD: ${MYSQLDB_ROOT_PASSWORD:-1234}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
