spring.datasource.url=${MYSQLDB_URL:jdbc:mysql://localhost:3306/car_sharing?serverTimezone=UTC}
spring.datasource.username=${MYSQLDB_USER:root}
spring.datasource.password=${MYSQLDB_ROOT_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

jwt.secret=${JWT_SECRET:mySuperSecretJwtKeyForCarSharingApplication12345}
jwt.expiration=${JWT_EXPIRATION:3000000}

app.base-url=${APP_BASE_URL:http://localhost:8080}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=usd
stripe.success-url=\
  ${STRIPE_SUCCESS_URL:http://localhost:8080/payments/success?session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=\
  ${STRIPE_CANCEL_URL:http://localhost:8080/payments/cancel?session_id={CHECKOUT_SESSION_ID}}

telegram.enabled=true
telegram.api-url=https://api.telegram.org
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
telegram.overdue-cron=0 0 9 * * *
