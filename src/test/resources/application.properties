spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.jpa.show-sql=false

jwt.secret=testSecretKeyForJwtTokenGeneration123456789
jwt.expiration=3000000

app.base-url=http://localhost:8080

stripe.secret-key=test_stripe_secret_key
stripe.webhook-secret=test_webhook_secret
stripe.currency=usd
stripe.success-url=http://localhost:8080/payments/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:8080/payments/cancel?session_id={CHECKOUT_SESSION_ID}

telegram.enabled=false
telegram.api-url=https://api.telegram.org
telegram.bot-token=test_bot_token
telegram.chat-id=test_chat_id
telegram.overdue-cron=0 0 9 * * *
